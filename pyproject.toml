[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tanin"
version = "0.1.0"
description = "xarray-native spectral analysis for geodetic time series"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "xarray", "pandas"]

[project.optional-dependencies]
test = ["pytest"]
mintpy = ["h5py"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
